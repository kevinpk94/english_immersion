name: Generate Lessons Index
on: [push] # Tự chạy mỗi khi bạn đẩy bài mới lên
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Generate index.json
        run: |
          # Quét các thư mục (loại bỏ folder bắt đầu bằng dấu chấm)
          ls -d */ | cut -f1 -d'/' | grep -v '^\.' > folders.txt
          # Chuyển danh sách thành định dạng JSON
          jq -R . folders.txt | jq -s . > index.json
      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add index.json
          git commit -m "Auto-update index.json" || exit 0
          git push